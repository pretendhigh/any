<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Any Codex Pet Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #16171b;
      color: #f4f2ee;
    }
    body {
      margin: 0;
      padding: 28px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 650;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      max-width: 1120px;
    }
    .item {
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 14px;
      background:
        linear-gradient(45deg, #2b2d33 25%, transparent 25%),
        linear-gradient(-45deg, #2b2d33 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2b2d33 75%),
        linear-gradient(-45deg, transparent 75%, #2b2d33 75%);
      background-color: #22242a;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      border: 1px solid #3b3d46;
      border-radius: 8px;
    }
    .sprite {
      width: 192px;
      height: 208px;
      background-image: url("any/spritesheet.webp");
      background-size: 1536px 1872px;
      image-rendering: auto;
      transform: scale(.78);
      transform-origin: center;
      margin: -22px 0;
    }
    .label {
      font-size: 13px;
      color: #d7d2ca;
    }
  </style>
</head>
<body>
  <h1>Any Codex Pet</h1>
  <main class="grid" id="grid"></main>
  <script>
    const rows = [
      ["idle", 0, 6, 280],
      ["running-right", 1, 8, 120],
      ["running-left", 2, 8, 120],
      ["waving", 3, 4, 140],
      ["jumping", 4, 5, 140],
      ["failed", 5, 8, 140],
      ["waiting", 6, 6, 150],
      ["running", 7, 6, 120],
      ["review", 8, 6, 150],
    ];
    const grid = document.querySelector("#grid");
    for (const [name, row, frames, ms] of rows) {
      const item = document.createElement("section");
      item.className = "item";
      const sprite = document.createElement("div");
      sprite.className = "sprite";
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = name;
      item.append(sprite, label);
      grid.append(item);
      let frame = 0;
      const tick = () => {
        sprite.style.backgroundPosition = `${-frame * 192}px ${-row * 208}px`;
        frame = (frame + 1) % frames;
      };
      tick();
      setInterval(tick, ms);
    }
  </script>
</body>
</html>
